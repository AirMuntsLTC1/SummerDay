name: Build Optimized Offline APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Android SDK & NDK
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk
            ${{ env.ANDROID_NDK_HOME }}
          key: android-sdk-${{ runner.os }}-${{ hashFiles('**/build.gradle*') }}
          restore-keys: |
            android-sdk-${{ runner.os }}-

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'
          cache: true
          pub-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK (cached)
        run: |
          if [ ! -d "$ANDROID_HOME/ndk/28.2.13676358" ]; then
            sdkmanager "ndk;28.2.13676358"
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Package Python App
        run: |
          mkdir -p app
          export SERIOUS_PYTHON_SITE_PACKAGES=$(pwd)/build/site-packages
          export SERIOUS_PYTHON_APP=$(pwd)/build/python-app
          dart run serious_python:main package python_app -p Android -r python_app/requirements.txt

      - name: Build arm64-only APK with shrinking
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/debug-info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
